<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuity — 状态续接管理</title>
<style>
:root {
  --bg-primary: #07111f;
  --bg-secondary: rgba(12, 22, 36, 0.88);
  --bg-tertiary: rgba(18, 31, 49, 0.96);
  --bg-hover: rgba(27, 44, 69, 0.88);
  --border: rgba(113, 152, 198, 0.18);
  --border-strong: rgba(127, 178, 238, 0.38);
  --text-primary: #edf6ff;
  --text-secondary: #95a8bf;
  --text-muted: #60758e;
  --accent: #67d4ff;
  --accent-strong: #7ca8ff;
  --accent-dim: rgba(77, 125, 207, 0.18);
  --green: #5df2c0;
  --green-dim: rgba(36, 120, 96, 0.22);
  --orange: #ffb76a;
  --orange-dim: rgba(126, 74, 26, 0.24);
  --red: #ff7a90;
  --red-dim: rgba(137, 37, 58, 0.22);
  --purple: #8f8cff;
  --purple-dim: rgba(86, 78, 188, 0.2);
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 24px 80px rgba(1, 8, 18, 0.42);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #040b14; }
body {
  font-family: "SF Pro Display", "Avenir Next", "PingFang SC", "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(103, 212, 255, 0.16), transparent 22%),
    radial-gradient(circle at 82% 18%, rgba(143, 140, 255, 0.16), transparent 24%),
    linear-gradient(135deg, #030814 0%, #07111f 48%, #09192d 100%);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 18px;
  height: 100vh;
  padding: 16px;
}

/* 侧边栏 */
.sidebar {
  overflow: hidden;
  background: linear-gradient(180deg, rgba(10, 23, 39, 0.94), rgba(8, 18, 33, 0.84));
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
}
.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding: 4px 8px 0; }
.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, rgba(143, 140, 255, 0.95), rgba(103, 212, 255, 0.9));
  border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #03111f;
  box-shadow: 0 8px 24px rgba(103, 212, 255, 0.2);
}
.logo h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.03em; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  padding: 10px 12px;
  border-radius: 13px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 13px;
  transition: all 0.15s;
  display: flex; align-items: center; gap: 10px;
  border: 1px solid transparent;
}
.nav-item:hover {
  background: rgba(20, 37, 58, 0.82);
  color: var(--text-primary);
}
.nav-item.active {
  background: linear-gradient(135deg, rgba(24, 59, 95, 0.92), rgba(25, 43, 84, 0.82));
  color: var(--text-primary);
  border-color: rgba(103, 212, 255, 0.2);
}
.nav-item .icon { opacity: 0.7; font-size: 14px; }
.nav-meta {
  margin-top: auto;
  padding: 14px 8px 4px;
  border-top: 1px solid rgba(113, 152, 198, 0.12);
  font-size: 12px; color: var(--text-muted);
}

/* 主区域 */
.main {
  overflow-y: auto;
  padding: 26px;
  border-radius: 30px;
  border: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(7, 18, 32, 0.9), rgba(7, 16, 29, 0.82));
  backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
}
.view-head { margin-bottom: 18px; }
.view-kicker { font-size: 11px; letter-spacing: 0.16em; color: var(--accent); margin-bottom: 6px; }
.page-title { font-size: 26px; font-weight: 680; letter-spacing: -0.04em; }
.page-subtitle { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }

/* 卡片 */
.section-card {
  background: linear-gradient(180deg, rgba(13, 24, 40, 0.9), rgba(9, 18, 31, 0.78));
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 16px;
}
.section-heading {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 14px;
}
.section-heading h3 { font-size: 14px; font-weight: 600; }
.section-heading span { font-size: 11px; color: var(--text-muted); }
.section-heading .actions { display: flex; gap: 8px; }

/* 统计 */
.stats-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-card {
  background: linear-gradient(180deg, rgba(13, 24, 39, 0.9), rgba(11, 20, 34, 0.74));
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
}
.stat-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.stat-card .value { font-size: 30px; font-weight: 720; letter-spacing: -0.05em; }

/* 按钮 */
.btn {
  padding: 8px 13px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(18, 31, 49, 0.72);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
}
.btn:hover { border-color: var(--border-strong); background: var(--bg-hover); }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); border-color: transparent; color: #04111f; font-weight: 700; }
.btn-primary:hover { transform: translateY(-1px); }
.btn-danger { border-color: rgba(255, 122, 144, 0.16); color: var(--red); }
.btn-danger:hover { background: var(--red-dim); }
.btn-success { border-color: rgba(93, 242, 192, 0.18); color: var(--green); }
.btn-success:hover { background: var(--green-dim); }
.btn-sm { padding: 5px 9px; font-size: 11px; }

/* 列表 */
.table-list { display: flex; flex-direction: column; gap: 10px; }
.table-card {
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(13, 24, 39, 0.84), rgba(8, 17, 29, 0.78));
  padding: 16px 18px;
  transition: border-color 0.15s;
}
.table-card:hover { border-color: var(--border-strong); }
.table-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; margin-bottom: 8px; }
.table-title { font-size: 14px; color: var(--text-primary); line-height: 1.4; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.meta-chip {
  display: inline-flex; align-items: center;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 11px;
  border: 1px solid rgba(113, 152, 198, 0.14);
  color: var(--text-secondary);
  background: rgba(255,255,255,0.03);
}
.status-chip {
  display: inline-flex; align-items: center;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.status-active { color: var(--green); background: var(--green-dim); }
.status-paused { color: var(--orange); background: var(--orange-dim); }
.status-closed { color: var(--text-muted); background: rgba(255,255,255,0.04); }
.card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* 工具栏 */
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.toolbar select, .toolbar input {
  background: rgba(6, 15, 28, 0.82);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 9px 13px;
  color: var(--text-primary);
  font-size: 12px;
}
.toolbar select:focus, .toolbar input:focus { outline: none; border-color: var(--accent); }

/* 弹窗 */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(3, 8, 16, 0.78);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal {
  background: linear-gradient(180deg, rgba(14, 26, 44, 0.98), rgba(9, 18, 31, 0.96));
  border: 1px solid var(--border-strong);
  border-radius: 24px;
  padding: 28px;
  width: 90vw; max-width: 580px;
  max-height: 85vh; overflow-y: auto;
  box-shadow: 0 30px 80px rgba(1, 6, 14, 0.6);
}
.modal h3 { font-size: 18px; margin-bottom: 18px; font-weight: 650; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  background: rgba(6, 15, 28, 0.82);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 11px 13px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
}
.form-group textarea { min-height: 80px; resize: vertical; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
.form-actions { display: flex; gap: 8px; margin-top: 18px; }

/* 详情 */
.detail-panel {
  background: linear-gradient(180deg, rgba(13, 24, 40, 0.92), rgba(9, 17, 29, 0.82));
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: 24px;
}
.detail-panel h3 { font-size: 16px; margin-bottom: 12px; }
.detail-row { display: flex; gap: 4px; margin-bottom: 8px; font-size: 13px; }
.detail-label { color: var(--text-muted); min-width: 100px; }
.detail-value { color: var(--text-primary); }
.audit-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.audit-table th { text-align: left; color: var(--text-muted); font-size: 11px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.audit-table td { padding: 8px 12px; border-bottom: 1px solid rgba(113, 152, 198, 0.06); color: var(--text-secondary); }
.audit-table tr:hover td { background: rgba(255,255,255,0.02); }

.empty-state {
  color: var(--text-muted); text-align: center;
  padding: 40px 16px; font-size: 13px;
  border: 1px dashed rgba(113, 152, 198, 0.18);
  border-radius: 18px;
}
.hidden { display: none; }

@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon">↻</div>
      <h1>Continuity</h1>
    </div>
    <div class="nav">
      <div class="nav-item active" data-view="dashboard"><span class="icon">◉</span>概览</div>
      <div class="nav-item" data-view="threads"><span class="icon">≡</span>对话线</div>
      <div class="nav-item" data-view="snapshots"><span class="icon">◈</span>状态快照</div>
      <div class="nav-item" data-view="handoffs"><span class="icon">↗</span>任务交接</div>
      <div class="nav-item" data-view="agent-state"><span class="icon">◇</span>长期状态</div>
      <div class="nav-item" data-view="audit"><span class="icon">☷</span>操作审计</div>
    </div>
    <div class="nav-meta">状态续接 v1</div>
    <div class="section-card" style="padding:12px;margin-top:14px">
      <div class="form-group">
        <label>当前 Agent</label>
        <select id="agent-filter" onchange="saveScopeAndReload()">
          <option value="">加载中…</option>
        </select>
      </div>
      <label style="display:block;font-size:11px;color:var(--text-muted);margin-bottom:8px">
        <input type="checkbox" id="include-shared" onchange="saveScopeAndReload()"> 含共享数据
      </label>
      <label style="display:block;font-size:11px;color:var(--text-muted)">
        <input type="checkbox" id="all-agents" onchange="saveScopeAndReload()"> 查看全部 Agent
      </label>
      <div id="agent-summary" style="font-size:10px;color:var(--text-muted);margin-top:8px;border-top:1px solid rgba(113,152,198,0.12);padding-top:8px"></div>
    </div>
  </div>
  <div class="main" id="main-content"></div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const API = '';
let currentView = 'dashboard';
const AGENT_COLORS = ['#67d4ff','#5df2c0','#ffb76a','#8f8cff','#ff7a90','#f0c667','#7ce3b3','#b8a0ff','#ff9e6d','#6cd9e0'];

function agentColor(agentId) {
  let hash = 0;
  for (let i = 0; i < agentId.length; i++) { hash = ((hash << 5) - hash) + agentId.charCodeAt(i); hash |= 0; }
  return AGENT_COLORS[Math.abs(hash) % AGENT_COLORS.length];
}

async function loadAgentDropdown() {
  try {
    const data = await apiFetch('/api/agents');
    const sel = document.getElementById('agent-filter');
    const saved = localStorage.getItem('continuity.agent_id') || '';
    sel.innerHTML = '<option value="">请选择 Agent</option>';
    if (!data.agents.length) {
      sel.innerHTML = '<option value="">无 Agent 数据</option>';
      updateAgentSummary([]);
      return;
    }
    data.agents.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.agent_id;
      opt.textContent = a.agent_id + ' (' + a.threads + '线)';
      if (a.agent_id === saved) opt.selected = true;
      sel.appendChild(opt);
    });
    updateAgentSummary(data.agents);
  } catch(e) {
    document.getElementById('agent-filter').innerHTML = '<option value="">加载失败，请刷新</option>';
  }
}

function updateAgentSummary(agents) {
  const total = agents.reduce((s,a) => s + a.threads, 0);
  document.getElementById('agent-summary').innerHTML = agents.length + ' 个 Agent · ' + total + ' 条对话线';
}

// Robust DOM init — prevent crash on missing elements
(function initCheckboxes() {
  try {
    const sharedEl = document.getElementById('include-shared');
    const allEl = document.getElementById('all-agents');
    if (sharedEl) sharedEl.checked = localStorage.getItem('continuity.include_shared') === '1';
    if (allEl) allEl.checked = localStorage.getItem('continuity.all_agents') === '1';
  } catch(e) { console.error('Continuity init error:', e); }
})();

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    showView(el.dataset.view);
  });
});

async function apiFetch(path, options) {
  const resp = await fetch(API + path, options);
  let data = null;
  try { data = await resp.json(); } catch (_) { data = null; }
  if (!resp.ok) throw new Error((data && data.detail) || `请求失败 HTTP ${resp.status}`);
  return data;
}

function currentAgentId() {
  return document.getElementById('agent-filter').value || '';
}

function scopeQuery() {
  const agent = currentAgentId();
  const params = new URLSearchParams();
  params.set('agent_id', agent);
  if (document.getElementById('include-shared').checked) params.set('include_shared', 'true');
  if (document.getElementById('all-agents').checked) params.set('all_agents', 'true');
  return params.toString();
}

function scoped(path) {
  const sep = path.includes('?') ? '&' : '?';
  return path + sep + scopeQuery();
}

function saveScopeAndReload() {
  localStorage.setItem('continuity.agent_id', currentAgentId());
  localStorage.setItem('continuity.include_shared', document.getElementById('include-shared').checked ? '1' : '0');
  localStorage.setItem('continuity.all_agents', document.getElementById('all-agents').checked ? '1' : '0');
  loadAgentDropdown().then(() => showView(currentView));
}

function showView(view) {
  currentView = view;
  if (view === 'dashboard') loadDashboard();
  else if (view === 'threads') loadThreads();
  else if (view === 'snapshots') loadSnapshots();
  else if (view === 'handoffs') loadHandoffs();
  else if (view === 'agent-state') loadAgentState();
  else if (view === 'audit') loadAudit();
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function chip(text, cls) {
  return `<span class="meta-chip ${cls||''}">${esc(text)}</span>`;
}

function statusChip(status) {
  const labels = { active: '进行中', paused: '已暂停', closed: '已关闭' };
  return `<span class="status-chip status-${esc(status)}">${labels[status] || status}</span>`;
}

function showModal(title, bodyHtml, onSave) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = `<h3>${title}</h3>${bodyHtml}
    <div class="form-actions">
      <button class="btn btn-primary" id="modal-save">保存</button>
      <button class="btn" onclick="closeModal()">取消</button>
    </div>`;
  overlay.classList.remove('hidden');
  if (onSave) {
    document.getElementById('modal-save').addEventListener('click', async () => {
      try { await onSave(); closeModal(); } catch (e) { alert('出错：' + e.message); }
    });
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

// ═══ 概览 ════════════════════════════════════════════════
async function loadDashboard() {
  const d = await apiFetch(scoped('/api/dashboard'));
  document.getElementById('main-content').innerHTML = `
    <div class="view-head">
      <div class="view-kicker">概览</div>
      <div class="page-title">状态续接控制台</div>
      <div class="page-subtitle">当前 Agent：<b style="color:${agentColor(currentAgentId())}">${esc(currentAgentId())}</b> · 对话线 · 状态快照 · 任务交接</div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="label">对话线</div><div class="value">${d.threads.total}</div></div>
      <div class="stat-card"><div class="label">进行中</div><div class="value" style="color:var(--green)">${d.threads.active}</div></div>
      <div class="stat-card"><div class="label">状态快照</div><div class="value" style="color:var(--accent)">${d.snapshots}</div></div>
      <div class="stat-card"><div class="label">任务交接</div><div class="value" style="color:var(--purple)">${d.handoffs}</div></div>
    </div>
    ${d.per_agent && d.per_agent.length > 0 ? `
    <div class="section-card">
      <div class="section-heading"><h3>各 Agent 概览</h3><span>点击切换</span></div>
      <div class="stats-row" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr))">
        ${d.per_agent.map(a => `
          <div class="stat-card" style="cursor:pointer;border-left:3px solid ${agentColor(a.agent_id)}" onclick="switchAgent('${esc(a.agent_id)}')">
            <div class="label" style="color:${agentColor(a.agent_id)};font-weight:600">◆ ${esc(a.agent_id)}</div>
            <div class="value" style="font-size:24px">${a.total} <span style="font-size:13px;color:var(--text-secondary)">线</span></div>
            <div style="font-size:11px;color:var(--green);margin-top:4px">${a.active} 进行中</div>
          </div>
        `).join('')}
      </div>
    </div>
    ` : ''}
    <div class="section-card">
      <div class="section-heading"><h3>最近对话线</h3></div>
      ${d.recent_threads && d.recent_threads.length ? renderThreadList(d.recent_threads) : '<div class="empty-state">暂无对话线</div>'}
    </div>
    <div class="section-card">
      <div class="section-heading"><h3>最近操作</h3></div>
      ${d.recent_audit && d.recent_audit.length ? renderAuditTable(d.recent_audit) : '<div class="empty-state">暂无审计记录</div>'}
    </div>`;
}

function switchAgent(agentId) {
  document.getElementById('agent-filter').value = agentId;
  saveScopeAndReload();
}

// ═══ 对话线 ══════════════════════════════════════════════
async function loadThreads() {
  const data = await apiFetch(scoped('/api/threads'));
  document.getElementById('main-content').innerHTML = `
    <div class="view-head">
      <div class="view-kicker">对话线</div>
      <div class="page-title">所有对话线</div>
    </div>
    <div class="section-card">
      <div class="toolbar">
        <select id="thread-filter" onchange="loadThreadsFiltered()">
          <option value="">全部状态</option>
          <option value="active">进行中</option>
          <option value="paused">已暂停</option>
          <option value="closed">已关闭</option>
        </select>
        <select id="thread-agent-filter" onchange="loadThreadsFiltered()">
          <option value="">全部 Agent</option>
        </select>
        <select id="thread-interpretation-filter" onchange="loadThreadsFiltered()">
          <option value="">全部解释状态</option>
          <option value="active">有效</option>
          <option value="needs_review">需复查</option>
          <option value="stale">已过期</option>
          <option value="closed">已关闭</option>
        </select>
        <span class="spacer"></span>
        <button class="btn" onclick="loadThreads()">刷新</button>
      </div>
      <div class="table-list" id="thread-list">${renderThreadList(data.threads)}</div>
    </div>`;
  populateAgentFilter(data.threads);
}

async function populateAgentFilter(threads) {
  const sel = document.getElementById('thread-agent-filter');
  if (!sel) return;
  const seen = new Set();
  threads.forEach(t => seen.add(t.agent_id));
  sel.innerHTML = '<option value="">全部 Agent</option>';
  seen.forEach(id => {
    sel.innerHTML += `<option value="${esc(id)}">${esc(id)}</option>`;
  });
}

async function loadThreadsFiltered() {
  const status = document.getElementById('thread-filter').value;
  const agentFilter = document.getElementById('thread-agent-filter')?.value || '';
  const interpretationFilter = document.getElementById('thread-interpretation-filter')?.value || '';
  let data = await apiFetch(scoped('/api/threads' + (status ? '?status=' + status : '')));
  if (agentFilter) {
    data.threads = data.threads.filter(t => t.agent_id === agentFilter);
  }
  if (interpretationFilter) {
    data.threads = data.threads.filter(t => (t.interpretation_status || 'active') === interpretationFilter);
  }

function interpretationLabel(status) {
  return ({

function renderEmotionalArc(arc) {
  if (!arc || !arc.length) return '<span style="color:var(--muted)">暂无</span>';
  return '<div style="max-height:200px;overflow-y:auto;margin-top:4px">' +
    arc.slice().reverse().map((e, i) => {
      const time = (e.archived_at||'').slice(5, 19).replace('T', ' ');
      return '<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:13px">' +
        '<span style="color:var(--muted)">' + esc(time) + '</span> ' +
        '<span>' + esc(e.position||'') + '</span></div>';
    }).join('') + '</div>';
}

        <td>${esc(e.action)}</td>
        <td>${esc(e.target_type)}${e.target_id ? ':'+esc(e.target_id.slice(0,16)) : ''}</td>
      </tr>`).join('')}</tbody></table>`;
}

// 启动
(async function boot() {
  try {
    await loadAgentDropdown();
  } catch(e) {
    console.error('loadAgentDropdown failed:', e);
    var sel = document.getElementById('agent-filter');
    if (sel) sel.innerHTML = '<option value="">加载失败</option>';
  }
  loadDashboard();
})();
</script>
</body>
</html>
